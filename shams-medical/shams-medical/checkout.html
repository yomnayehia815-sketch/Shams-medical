<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Checkout | Shams Medical</title>
    <meta name="description" content="Complete your order.">
    <meta property="og:title" content="Checkout | Shams Medical">
    <meta property="og:description" content="Complete your order.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="checkout" data-nav="cart.html">
    <div id="site-header"></div>
    <main>
        <div class="wrap">
            <nav class="bc"><a href="index.html">Home</a> / Checkout</nav>
            <h1 style="font-size:2.4rem;margin-bottom:6px">Checkout</h1>
            <p class="note">Demo checkout: no real payment or order is processed.</p>
            <div id="co" class="lay">
                <form id="cof" class="form" novalidate>
                    <div><label for="name">Full name</label><input id="name" name="name" type="text"
                            autocomplete=name><span class="err" role="alert"></span></div>
                    <div><label for="phone">Phone number</label><input id="phone" name="phone" type="tel"
                            autocomplete=tel><span class="err" role="alert"></span></div>
                    <div><label for="email">Email</label><input id="email" name="email" type="email"
                            autocomplete=email><span class="err" role="alert"></span></div>
                    <div><label for="gov">Governorate</label><select id="gov" name="gov">
                            <option value="">Select</option>
                            <option>Cairo</option>
                            <option>Giza</option>
                            <option>Alexandria</option>
                            <option>Beheira</option>
                            <option>Dakahlia</option>
                            <option>Gharbia</option>
                            <option>Sharqia</option>
                            <option>Qalyubia</option>
                            <option>Menoufia</option>
                            <option>Kafr El Sheikh</option>
                            <option>Damietta</option>
                            <option>Port Said</option>
                            <option>Ismailia</option>
                            <option>Suez</option>
                            <option>Fayoum</option>
                            <option>Beni Suef</option>
                            <option>Minya</option>
                            <option>Asyut</option>
                            <option>Sohag</option>
                            <option>Qena</option>
                            <option>Luxor</option>
                            <option>Aswan</option>
                            <option>Other</option>
                        </select><span class="err" role="alert"></span></div>
                    <div><label for="city">City or area</label><input id="city" name="city" type="text"><span
                            class="err" role="alert"></span></div>
                    <div><label for="address">Delivery address</label><textarea id="address" name="address"
                            rows="3"></textarea><span class="err" role="alert"></span></div>
                    <div><label for="notes">Order notes (optional)</label><textarea id="notes" name="notes"
                            rows="2"></textarea></div>
                    <fieldset style="border:1px solid var(--taupe);padding:12px;border-radius:6px">
                        <legend>Payment method</legend><label><input type="radio" name="pay" value="cod" checked
                                style="width:auto"> Cash on delivery</label><label><input type="radio" name="pay"
                                value="online" style="width:auto"> Online payment (demo, nothing is charged)</label>
                    </fieldset><button class="btn gold">Place demo order</button><button type="button" class="btn ghost"
                        id="wa">Send order via WhatsApp</button>
                </form>
                <aside class="sum">
                    <h3>Order summary</h3>
                    <div id="cos" style="display:block"></div>
                </aside>
            </div>
        </div>
    </main>
    <div id="site-footer"></div>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
</body>

</html>

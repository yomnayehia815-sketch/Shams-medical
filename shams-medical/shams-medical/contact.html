<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <meta name="description" content="Contact Us">
    <meta property="og:title" content="Contact Us | Shams Medical">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="" data-nav="contact.html">
    <div id="site-header"></div>
    <main>
        <div class="wrap page">
            <nav class="bc"><a href="index.html">Home</a> / Contact Us</nav>
            <h1>Contact Us</h1>
            <p class="note">Phone, email and address: to be added by the store.</p>
            <form data-contact class="form" style="margin-top:16px">
                <div><label for="cn">Name</label><input id="cn" required></div>
                <div><label for="ce">Email</label><input id="ce" type="email" required></div>
                <div><label for="cm">Message</label><textarea id="cm" rows="4" required></textarea></div><button
                    class="btn">Send message</button>
                <p class="note">Frontend demo: messages are not sent.</p>
            </form>
        </div>
    </main>
    <div id="site-footer"></div>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
</body>
